<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acceso | NovaDynamics</title>

<style>

/* =========================
   CONFIGURACIÓN
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    font-family:
        Inter,
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    color: #ffffff;

    background:

        radial-gradient(
            circle at 50% -20%,
            rgba(85, 90, 150, 0.22),
            transparent 42%
        ),

        radial-gradient(
            circle at 10% 90%,
            rgba(50, 60, 120, 0.12),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #090b12 0%,
            #070910 50%,
            #05060b 100%
        );

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

}


/* =========================
   EFECTO DE FONDO
========================= */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 50% 50%,
            transparent 0%,
            rgba(0,0,0,0.12) 60%,
            rgba(0,0,0,0.4) 100%
        );

}


/* =========================
   PANTALLA DE ACCESO
========================= */

.login-screen {

    width: 100%;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

}


/* =========================
   CAJA DE LOGIN
========================= */

.login-box {

    width: 100%;

    max-width: 390px;

    text-align: center;

    padding: 42px 35px;

    background:
        rgba(12, 14, 23, 0.72);

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 18px;

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,0.45);

}


/* =========================
   TÍTULO
========================= */

.title {

    font-size: 26px;

    font-weight: 700;

    letter-spacing: -0.5px;

    margin-bottom: 9px;

}


.subtitle {

    color: #8b91a3;

    font-size: 14px;

    margin-bottom: 28px;

}


/* =========================
   CAMPO
========================= */

.input-wrapper {

    position: relative;

    width: 100%;

    margin-bottom: 14px;

}


.password-input {

    width: 100%;

    height: 50px;

    padding:

        0 52px

        0 16px;

    border-radius: 10px;

    border:

        1px solid
        rgba(255,255,255,0.09);

    background:

        rgba(255,255,255,0.035);

    color: #ffffff;

    outline: none;

    font-size: 14px;

    text-align: left;

    transition:
        border-color 0.2s,
        background 0.2s,
        box-shadow 0.2s;

}


.password-input::placeholder {

    color:
        #6f7585;

}


.password-input:focus {

    border-color:
        rgba(130,140,255,0.55);

    background:
        rgba(255,255,255,0.05);

    box-shadow:

        0 0 0 3px
        rgba(100,110,255,0.08);

}


/* =========================
   BOTÓN OJO
========================= */

.eye-button {

    position: absolute;

    right: 13px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 30px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: none;

    background: transparent;

    color: #858b9b;

    cursor: pointer;

    font-size: 17px;

    border-radius: 7px;

    transition:
        background 0.2s,
        color 0.2s;

}


.eye-button:hover {

    background:
        rgba(255,255,255,0.06);

    color:
        #ffffff;

}


/* =========================
   BOTÓN ACCEDER
========================= */

.login-button {

    width: 100%;

    height: 50px;

    border: none;

    border-radius: 10px;

    background:

        linear-gradient(
            135deg,
            #6366f1,
            #7c5cff
        );

    color: white;

    font-size: 14px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s,
        opacity 0.2s;

}


.login-button:hover {

    transform:
        translateY(-1px);

    box-shadow:

        0 10px 25px
        rgba(99,102,241,0.25);

}


.login-button:active {

    transform:
        translateY(0);

}


/* =========================
   ERROR
========================= */

.error-message {

    display: none;

    margin-top: 14px;

    color:
        #ff6b81;

    font-size: 13px;

}


.error-message.show {

    display: block;

}


/* =========================
   PIE
========================= */

.footer {

    margin-top: 28px;

    color:
        #555b6b;

    font-size: 11px;

    letter-spacing:
        0.3px;

}


/* =========================
   CONTENIDO DESPUÉS DEL LOGIN
========================= */

#mainContent {

    display: none;

    width: 100%;

    min-height: 100vh;

    justify-content: center;

    align-items: center;

}


.welcome {

    text-align: center;

}


.welcome h2 {

    font-size: 28px;

    margin-bottom: 10px;

}


.welcome p {

    color:
        #8b91a3;

}


/* =========================
   MÓVIL
========================= */

@media (max-width: 480px) {

    .login-box {

        padding:
            35px 22px;

        border-radius:
            16px;

    }

    .title {

        font-size:
            24px;

    }

}

</style>
</head>


<body>


<!-- =========================
     PANTALLA DE ACCESO
========================= -->

<div
    class="login-screen"
    id="loginScreen"
>

    <div
        class="login-box"
    >

        <h1 class="title">
            ACCESO
        </h1>

        <p class="subtitle">
            Introduce tu contraseña para continuar
        </p>


        <!-- CONTRASEÑA -->

        <div
            class="input-wrapper"
        >

            <input
                type="password"
                id="passwordInput"
                class="password-input"
                placeholder="Contraseña"
                autocomplete="off"
                onkeydown="
                    if(event.key === 'Enter')
                    checkPassword()
                "
            >


            <!-- OJO -->

            <button
                type="button"
                class="eye-button"
                id="eyeButton"
                onclick="togglePassword()"
                aria-label="Mostrar contraseña"
            >
                👁
            </button>

        </div>


        <!-- BOTÓN -->

        <button
            type="button"
            class="login-button"
            onclick="checkPassword()"
        >
            Entrar
        </button>


        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage"
        >
            Contraseña incorrecta
        </div>


        <div class="footer">
            NovaDynamics
        </div>

    </div>

</div>


<!-- =========================
     CONTENIDO PROTEGIDO
========================= -->

<div
    id="mainContent"
>

    <div class="welcome">

        <h2>
            Acceso concedido
        </h2>

        <p>
            Bienvenido a NovaDynamics.
        </p>

    </div>

</div>


<script>

/* =========================
   CONTRASEÑA
========================= */

const PASSWORD = "nova2026";


/* =========================
   MOSTRAR / OCULTAR
========================= */

function togglePassword() {

    const input =
        document.getElementById(
            "passwordInput"
        );

    const eye =
        document.getElementById(
            "eyeButton"
        );


    if (
        input.type === "password"
    ) {

        input.type = "text";

        eye.textContent = "🙈";

        eye.setAttribute(
            "aria-label",
            "Ocultar contraseña"
        );

    } else {

        input.type = "password";

        eye.textContent = "👁";

        eye.setAttribute(
            "aria-label",
            "Mostrar contraseña"
        );

    }

}


/* =========================
   COMPROBAR CONTRASEÑA
========================= */

function checkPassword() {

    const input =
        document.getElementById(
            "passwordInput"
        );

    const error =
        document.getElementById(
            "errorMessage"
        );


    if (
        input.value === PASSWORD
    ) {

        error.classList.remove(
            "show"
        );


        document
            .getElementById(
                "loginScreen"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "mainContent"
            )
            .style.display =
            "flex";


        input.value = "";


    } else {

        error.classList.add(
            "show"
        );


        input.value = "";

        input.focus();

    }

}

</script>

</body>
</html>
